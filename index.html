  v.innerHTML=`<div class="phead"><button class="back" id="pb" aria-label="Back">‹</button><h1 class="title">Theme</h1><span></span></div>
    <p class="muted" style="font-size:13px;margin:0 0 12px">Changes the colours of the app. Your bookcases keep their own.</p>
    ${Object.entries(APP_THEMES).map(([k,t])=>`<button class="thcard${cur===k?' on':''}" data-th="${k}"><span class="thsw" style="background:${t[2]}"><i style="width:9px;height:22px;background:${t[8]}"></i><i style="flex:1;height:4px;background:${t[5]};box-shadow:0 8px 0 ${t[6]},0 -8px 0 ${t[10]}"></i></span><span><b>${t[0]}</b>${t[1]}</span></button>`).join('')}`;
  $('#pb').onclick=()=>{page=null;render()};
  v.querySelectorAll('[data-th]').forEach(x=>x.onclick=()=>{S.theme=x.dataset.th;applyAppTheme();save();repaintPage()});
}

/* ---------- share the shelf as an image: story, square or wallpaper ---------- */
const SHAPES={story:['Story',1080,1920],square:['Square',1080,1080],wall:['Wallpaper',1170,2532]};   // wallpaper: a phone lock screen
let shareShape='story', shareStats=true;
function exportShelfPNG(){
  openModal(`<h2 class="center serif">Share</h2><div class="shprev" id="shp"><span class="muted">Drawing your shelf…</span></div>
    <div class="fchips" style="justify-content:center">${Object.entries(SHAPES).map(([k,s])=>`<button class="fchip2${shareShape===k?' on':''}" data-shp="${k}">${s[0]}</button>`).join('')}</div>
    <div class="hrow" style="margin:4px 4px 14px"><span>Include stats</span><button class="fchip2${shareStats?' on':''}" id="shst">${shareStats?'On':'Off'}</button></div>
    <div class="row"><button class="btn" id="shc">Close</button><button class="btn y" id="shs" disabled>Save image</button></div>`,async()=>{
    $('#shc').onclick=closeModal;
    let base;try{base=await shelfCanvas()}catch(e){}
    if(!$('#shp'))return;
    if(!base){$('#shp').innerHTML='<span class="muted">Could not draw your shelf.</span>';return}
    let blob=null;
    const paint=async()=>{
      const [,w,h]=SHAPES[shareShape],c=document.createElement('canvas'),foot=shareStats?90:0;
      c.width=w||base.width;c.height=(h||base.height)+(w?0:foot);
      const x=c.getContext('2d');x.fillStyle='#0b0b0c';x.fillRect(0,0,c.width,c.height);
      const availH=c.height-foot-(w?80:0),z=Math.min((c.width-(w?80:0))/base.width,availH/base.height);
      x.drawImage(base,(c.width-base.width*z)/2,(w?40:0)+(availH-base.height*z)/2,base.width*z,base.height*z);
      if(shareStats){const fin=S.books.filter(b=>b.status==='finished').length,pg=S.sessions.reduce((a,s)=>a+(s.pages||0),0);
        x.fillStyle='#e8dcc8';x.textAlign='center';x.font=`${Math.round(c.width/30)}px Georgia,serif`;
        x.fillText(`${S.books.length} Books · ${fin} Read · ${pg.toLocaleString()} Pages`,c.width/2,c.height-foot/2+8)}
      blob=await new Promise(r=>c.toBlob(r,'image/png'));
      if(!$('#shp'))return;
      const im=new Image();im.src=URL.createObjectURL(blob);$('#shp').innerHTML='';$('#shp').appendChild(im);$('#shs').disabled=false;
    };
    $('#modal').querySelectorAll('[data-shp]').forEach(b=>b.onclick=()=>{shareShape=b.dataset.shp;$('#modal').querySelectorAll('[data-shp]').forEach(y=>y.classList.toggle('on',y===b));paint()});
    $('#shst').onclick=()=>{shareStats=!shareStats;$('#shst').classList.toggle('on',shareStats);$('#shst').textContent=shareStats?'On':'Off';paint()};
    $('#shs').onclick=async()=>{
      if(!blob)return;
      const file=new File([blob],'my-bookshelf.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'My bookshelf'});return}catch(e){if(e.name==='AbortError')return}}
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-bookshelf.png';document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Shelf saved as PNG');
    };
    paint();
  });
}

/* boot */
/* ---------- account: log in, and keep the library saved on the server ---------- */
const AKEY='bookshelf-auth', GKEY='bookshelf-guest', EMPTY=()=>({books:[],sessions:[],notes:[],currentId:null,timer:null});
var auth=null, syncT=null, syncState='', lastPushed='';
try{auth=JSON.parse(localStorage.getItem(AKEY))}catch(e){}
async function api(path,method='GET',body){
  let r;
  try{r=await fetch('api/'+path,{method,headers:Object.assign({'Content-Type':'application/json'},auth?{Authorization:'Bearer '+auth.token}:{}),body:body===undefined?undefined:JSON.stringify(body)})}
  catch(e){throw new Error('Cannot reach the server')}
  let j=null;try{j=await r.json()}catch(e){}
  if(!j)throw Object.assign(new Error('Accounts need the app started with server.py'),{status:r.status});
  if(!r.ok)throw Object.assign(new Error(j.error||'Request failed'),{status:r.status});
  return j;
}
function setSync(t){syncState=t;const el=$('#sync');if(el)el.textContent=t}
function setAuth(a){auth=a;try{a?localStorage.setItem(AKEY,JSON.stringify(a)):localStorage.removeItem(AKEY)}catch(e){}}
function queuePush(){if(!auth)return;clearTimeout(syncT);syncT=setTimeout(push,900)}
async function push(){
  clearTimeout(syncT);syncT=null;if(!auth)return true;
  const js=JSON.stringify(S);
  if(js!==lastPushed){
    setSync('Saving…');
    try{await api('data','PUT',{data:S});lastPushed=js}
    catch(e){
      if(e.status===401){setAuth(null);showGate('Your session ended. Please log in again.')}
      setSync('Not saved to your account: '+e.message);return false}
  }
  setSync('Saved to your account');return true;
}
function useServerData(d){S=d;ensure();lastPushed=JSON.stringify(S);try{localStorage.setItem(KEY,lastPushed)}catch(e){}}
async function signIn(mode,username,password){
  const j=await api(mode,'POST',{username,password});
  setAuth({token:j.token,username:j.username});
  if(j.data)useServerData(j.data);          // an existing account: its library replaces what is in this browser
  else await push();                        // a new or empty account: it takes the library in this browser
}
async function logOut(){
  if(!(await push())){if(!confirm('Your latest changes could not be saved to your account. Log out anyway and lose them?'))return}
  try{await api('logout','POST',{})}catch(e){}
  setAuth(null);S=EMPTY();ensure();lastPushed='';
  try{localStorage.removeItem(KEY);localStorage.removeItem(GKEY)}catch(e){}
  tab='home';page=null;render();showGate();
}
function showGate(msg){
  const g=$('#gate');
  g.innerHTML=`<h2>Book Shelf</h2><p class="muted center" style="margin:0 0 18px">Log in to keep your library on any device.</p>
    <label>Email or username</label><input id="gu" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label>Password (6 characters or more)</label><input id="gp" type="password" autocomplete="current-password">
    <div class="err" id="ge">${esc(msg||'')}</div>
    <div class="stack" style="margin:0"><button class="btn y" id="gl">Log in</button><button class="btn" id="gs">Create account</button></div>
    <button class="skip" id="gk">Continue without an account</button>`;
  g.classList.add('show');
  const go=async mode=>{
    const u=$('#gu').value.trim(),p=$('#gp').value;
    if(!u||!p){$('#ge').textContent='Enter a username and a password';return}
    $('#gl').disabled=$('#gs').disabled=true;$('#ge').textContent='';
    try{await signIn(mode,u,p);g.classList.remove('show');g.innerHTML='';render();toast(mode==='signup'?'Account created':'Logged in')}
    catch(e){$('#ge').textContent=e.message;$('#gl').disabled=$('#gs').disabled=false}
  };
  $('#gl').onclick=()=>go('login');$('#gs').onclick=()=>go('signup');
  $('#gp').onkeydown=e=>{if(e.key==='Enter')go('login')};
  $('#gk').onclick=()=>{try{localStorage.setItem(GKEY,'1')}catch(e){}g.classList.remove('show');g.innerHTML=''};
}
async function boot(){
  if(VIEW)return viewShared();
  ensure();
  if(S.timer&&!book(S.timer.bookId))S.timer=null;
  render();
  let guest=false;try{guest=!!localStorage.getItem(GKEY)}catch(e){}
  if(!auth){if(!guest)showGate();return}
  try{const j=await api('data');if(j.data){useServerData(j.data);render()}else await push()}
  catch(e){
    if(e.status===401){setAuth(null);showGate('Your session ended. Please log in again.')}
    else setSync('Offline: showing the copy saved in this browser')}
}
window.addEventListener('pagehide',()=>{if(auth&&syncT&&JSON.stringify(S)!==lastPushed)fetch('api/data',{method:'PUT',keepalive:true,headers:{'Content-Type':'application/json',Authorization:'Bearer '+auth.token},body:JSON.stringify({data:S})})});
boot();
</script>
