<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Book Shelf</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--accent:#b3474d;--accentfg:#fff5ea;--nav:#3d2d25e6;--seg:#4d3a2f;--sheet:#30231d;--bg:#000;--card:#161618;--card2:#1f1f22;--fg:#f2f2f2;--muted:#8a8a90;--line:#2a2a2e;--yellow:#ffc933;--blue:#0a84ff;--pink:#e0457b;--amber:#f5a623}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,"Inter",system-ui,sans-serif}
  #app{max-width:460px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
  #view{flex:1;overflow-y:auto;padding:18px 18px 100px}
  h1.title{font-size:15px;font-weight:600;text-align:center;margin:0 0 14px;color:var(--fg)}
  .serif{font-family:Georgia,"Times New Roman",serif}
  .muted{color:var(--muted)}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .btn{display:block;width:100%;padding:13px;border-radius:999px;font-weight:600;text-align:center;background:var(--card2);color:var(--fg)}
  .btn.y{background:var(--accent);color:var(--accentfg)}
  .btn.r{background:#3a1416;color:#ff6b6b}
  .btn.sm{display:inline-block;width:auto;padding:8px 16px;font-size:13px}
  input,textarea,select{width:100%;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
  input:focus,textarea:focus{border-color:var(--blue)}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
  /* tabbar */
  nav{display:flex;position:absolute;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:4;border:1px solid #ffffff18;border-radius:999px;background:var(--nav);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:5px 6px}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);padding:6px 0;border-radius:14px}
  nav button .i{line-height:0}
  nav button.on{color:var(--fg);background:var(--card2)}
  /* covers */
  .cover{width:100%;aspect-ratio:2/3;border-radius:6px;object-fit:cover;background:#222;display:block;box-shadow:0 6px 18px #0009}
  .ph{width:100%;aspect-ratio:2/3;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:8%;text-align:center;font-family:Georgia,serif;font-weight:700;line-height:1;color:#111;overflow:hidden;word-break:break-word;box-shadow:0 6px 18px #0009}
  /* reading */
  .hero{width:62%;margin:10px auto 18px}
  .hero .ph{font-size:34px}
  .center{text-align:center}
  .bname{font-weight:700;font-size:17px}
  .prog{font-size:11px;color:var(--muted);margin:4px 0 18px;font-family:ui-monospace,monospace}
  .bar{height:5px;background:var(--card2);border-radius:5px;overflow:hidden;margin:6px auto 0;max-width:200px}
  .bar i{display:block;height:100%;background:var(--yellow)}
  .stack{display:flex;flex-direction:column;gap:10px;margin:0 8px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty .big{font-size:48px}
  .pager{display:flex;justify-content:center;gap:6px;margin-top:-8px;margin-bottom:12px}
  .pager i{width:6px;height:6px;border-radius:50%;background:#444}.pager i.on{background:#fff}
  /* library */
  .seg{display:flex;background:var(--card);border-radius:999px;padding:3px;margin-bottom:14px}
  .seg button{flex:1;padding:7px 4px;font-size:13px;border-radius:999px;color:var(--muted)}
  .seg button.on{background:var(--accent);color:var(--accentfg)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .grid .ph{font-size:13px}
  .gt{font-size:11px;margin-top:6px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .shelfhead{text-align:center;margin:6px 0 16px}
  .shelfhead b{font:700 24px Georgia,"Times New Roman",serif;display:block}
  .shelfhead span{font-size:11px;color:var(--muted)}
  .case{--ledge:#1b1b1d;border-radius:10px;overflow:hidden;margin:0 -6px}
  .shelf{display:flex;align-items:flex-end;gap:1px;padding:14px 8px 0;height:176px;box-shadow:inset 0 -20px 22px -14px #000b;overflow:hidden;position:relative}
  .spine{flex:none;position:relative;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;font:700 10px Georgia,serif;letter-spacing:.3px;color:#fff;border-radius:2px 2px 0 0;overflow:hidden;padding:6px 0;text-shadow:0 0 3px #000,0 1px 2px #000;cursor:pointer;white-space:nowrap;transition:transform .2s;transform-origin:bottom center}
  .spine:hover,.spine:active{transform:translateY(-8px)}
  .spine.lean{transform:rotate(-7deg);transform-origin:bottom left;margin-left:3px}
  .spine::after,.flat::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0008,#0000 28%,#fff2 50%,#0000 72%,#0009);pointer-events:none}
  .flat::after{background:linear-gradient(#fff2,#0000 40%,#0008)}
  .stackcol{flex:none;display:flex;flex-direction:column-reverse;align-items:center;margin:0 6px}
  .flat{position:relative;display:flex;align-items:center;justify-content:center;font:700 9px Georgia,serif;color:#fff;text-shadow:0 0 3px #000,0 1px 2px #000;border-radius:2px;overflow:hidden;white-space:nowrap;cursor:pointer;padding:0 6px}
  .deco{flex:none;line-height:0;margin-left:4px;position:relative;filter:drop-shadow(0 5px 5px #000b)}
  .fl{position:absolute;width:var(--s);height:calc(var(--s)*2);transform:translate(-50%,-100%);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(ellipse at 50% 72%,#fff 0 20%,var(--f1,#ffe9a0) 34%,var(--f2,#ffa92b) 62%,transparent 100%);animation:flick 1.4s infinite alternate ease-in-out;pointer-events:none}
  .fl::after{content:"";position:absolute;left:50%;top:55%;width:calc(var(--s)*11);height:calc(var(--s)*11);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--f3,#ffbe5a),transparent 68%);opacity:.5;mix-blend-mode:screen}
  .fl.glow{background:none;animation:none}
  @keyframes flick{0%{transform:translate(-50%,-100%) scale(1,1)}50%{transform:translate(-56%,-100%) scale(.9,1.1)}100%{transform:translate(-45%,-100%) scale(1.06,.94)}}
  @media(prefers-reduced-motion:reduce){.fl{animation:none}}
  .deco img{width:100%;height:100%;display:block;-webkit-user-drag:none}
  .orow img{width:100%;height:100%;object-fit:contain;display:block}
  .sp-gap{flex:1}
  .lights.strip{height:40px;background:linear-gradient(var(--lc) 0 3px,color-mix(in srgb,var(--lg) 50%,transparent) 3px,transparent 100%)}
  .ledge{height:14px;position:relative;box-shadow:0 6px 9px #000b}
  .ledge::after{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff66,#fff0 22%,#0000 50%,#000000a0)}
  .shelf.selrow{box-shadow:inset 0 0 0 2px #ffc933aa}
  .sel{outline:2px solid var(--yellow);outline-offset:1px}
  .cov{flex:none;cursor:pointer;margin-right:1px}
  .cov img,.cov .ph{width:100%;height:100%;aspect-ratio:auto;border-radius:2px;font-size:10px;box-shadow:2px 0 6px #0008}
  .edge{flex:none;cursor:pointer;border-radius:1px;background:repeating-linear-gradient(90deg,#f5f1e7 0 2px,#cfc8b8 2px 3px);border-top:3px solid #777;border-bottom:3px solid #777}
  .lights{height:20px;background:radial-gradient(circle,#fff 0 1px,var(--lc,#ffd25a) 1.6px 2.6px,var(--lg,#ffa21acc) 3.2px,transparent 7px) 0 3px/18px 14px repeat-x;filter:drop-shadow(0 0 4px var(--lg,#ffa21a))}
  .lsw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;box-shadow:0 0 6px currentColor}
  .drape{height:48px;background-repeat:repeat-x;background-size:92px 48px;filter:drop-shadow(0 5px 5px #0009);position:relative;z-index:1}
  /* decorate mode */
  #app.editing nav{display:none}
  #app.editing .case{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #app.editing .case [data-id],#app.editing .deco{cursor:grab}
  .ghost{z-index:60;pointer-events:none;opacity:.95;transform:scale(1.08) rotate(-4deg)!important;box-shadow:0 14px 26px #000c;cursor:grabbing}
  .spine .st{font-style:italic}
  .sa{position:absolute;bottom:5px;left:0;right:0;text-align:center;writing-mode:horizontal-tb;font:700 6.5px Georgia,serif;letter-spacing:0;overflow:hidden;white-space:nowrap;opacity:.9}
  .b-spine .sa{font-size:8px;bottom:10px}.b-spine .st{font-style:italic;font-size:13px}
  #app.editing #view{padding-bottom:300px}
  #editui{position:absolute;left:10px;right:10px;bottom:12px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  #editui:empty{display:none}
  #editui>*{pointer-events:auto}
  .hint{background:#2a211cd9;border:1px solid #fff2;border-radius:999px;padding:8px 18px;font-style:italic;font-size:15px;color:#eadfce;backdrop-filter:blur(12px);max-width:92%;text-align:center}
  .epanel{width:100%;max-height:46vh;overflow-y:auto;background:#2a211cf0;border:1px solid #fff2;border-radius:24px;padding:12px;backdrop-filter:blur(16px)}
  .prow{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:3px 0}
  .prow span{flex:none;width:74px;font:600 11px Georgia,serif;color:#a8997f}
  .prow b{min-width:18px;text-align:center}
  .prow .chip{padding:6px 11px;font-size:12px}
  .etools{display:flex;gap:4px;background:#2a211cf0;border:1px solid #fff2;border-radius:999px;padding:5px}
  .etools button{width:54px;height:44px;border-radius:999px;font-size:20px}
  .etools button.on{background:#fff2}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
  .chip{flex:none;padding:8px 14px;border-radius:999px;background:#ffffff14;font:600 13px Georgia,serif;color:#cdbfa8;white-space:nowrap}
  .chip.on{background:#fff3;color:#fff}
  .pgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .orow,.srow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .orow button{flex:none;width:78px;height:86px;border-radius:14px;padding:6px;position:relative;filter:drop-shadow(0 3px 4px #0008)}
  .orow .del{position:absolute;top:0;right:0;width:20px;height:20px;border-radius:50%;background:#000a;color:#fff;font:14px/20px system-ui}
  .orow .addpic{border:1px dashed #fff4;font:600 10px Georgia,serif;color:#cdbfa8;filter:none}
  .addpic em,.sw em{display:block;font:300 30px/1 system-ui;font-style:normal;color:#cdbfa8}
  .sw em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .orow button:active{background:#fff2}
  .sw{flex:none;width:78px;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px Georgia,serif;color:#cdbfa8}
  .sw i{display:block;width:64px;height:76px;border-radius:12px;border:2px solid #fff2;position:relative;overflow:hidden}
  .sw i::after{content:"";position:absolute;left:0;right:0;top:56%;height:8px;background:var(--l)}
  .sw.on{color:#fff}.sw.on i{border-color:var(--yellow)}
  .edhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .edhead b{font-size:24px;display:block}.edhead span{font-size:12px;color:var(--muted)}
  /* 3D book overlay */
  #bookov{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;background:#0d0a08b8;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
  #bookov.show{display:flex}
  #bookov .x{position:absolute;top:16px;left:16px;width:34px;height:34px;border-radius:50%;background:#fff1;font-size:16px}
  .stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;perspective:1000px;touch-action:none;cursor:grab}
  .book3d{--w:180px;--h:270px;--d:34px;width:var(--w);height:var(--h);position:relative;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.2,.85,.25,1)}
  .book3d.drag{transition:none}
  .book3d>div{position:absolute;backface-visibility:hidden;overflow:hidden}
  .b-front,.b-back{inset:0;border-radius:2px 4px 4px 2px}
  .b-front{transform:translateZ(calc(var(--d)/2))}
  .b-front img,.b-front .ph{width:100%;height:100%;aspect-ratio:auto;border-radius:0;object-fit:cover;box-shadow:none;font-size:26px}
  .b-front::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0006,#fff2 4%,#0000 9%,#0000 92%,#0003)}
  .b-back{transform:rotateY(180deg) translateZ(calc(var(--d)/2));padding:16px 14px;color:#eee;font-family:Georgia,serif;display:flex;flex-direction:column}
  .b-back b{font-size:14px;margin-bottom:8px}.b-back p{flex:1;margin:0;font-size:7.5px;line-height:1.45;overflow:hidden;-webkit-mask:linear-gradient(#000 80%,#0000);mask:linear-gradient(#000 80%,#0000)}
  .barcode{align-self:flex-end;background:#fff;color:#111;font:6px ui-monospace,monospace;padding:4px 5px 2px;margin-top:6px;text-align:center;letter-spacing:.5px}
  .barcode i{display:block;width:62px;height:20px;margin-bottom:2px;background:repeating-linear-gradient(90deg,#111 0 1px,#fff 1px 2px,#111 2px 4px,#fff 4px 5px,#111 5px 6px,#fff 6px 8px,#111 8px 9px,#fff 9px 11px)}
  .b-spine{width:var(--d);height:var(--h);left:calc((var(--w) - var(--d))/2);transform:rotateY(-90deg) translateZ(calc(var(--w)/2));writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;font:700 12px Georgia,serif;color:#fff;text-shadow:0 0 3px #000,0 1px 2px #000;white-space:nowrap}
  .b-spine::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0007,#0000 30%,#fff2 50%,#0000 70%,#0008)}
  .b-pages{width:var(--d);height:calc(var(--h) - 6px);top:3px;left:calc((var(--w) - var(--d))/2);transform:rotateY(90deg) translateZ(calc(var(--w)/2 - 3px));background:repeating-linear-gradient(90deg,#f5f1e7 0 2px,#d6d0c2 2px 3px)}
  .b-top,.b-bot{width:calc(var(--w) - 4px);height:var(--d);top:calc((var(--h) - var(--d))/2);background:repeating-linear-gradient(#f5f1e7 0 2px,#d6d0c2 2px 3px)}
  .b-top{transform:rotateX(90deg) translateZ(calc(var(--h)/2 - 3px))}
  .b-bot{transform:rotateX(-90deg) translateZ(calc(var(--h)/2 - 3px))}
  .bk-info{text-align:center;padding:0 24px 18px}
  .bk-info b{font:700 19px Georgia,serif;display:block}
  .bk-info span{font-size:12px;color:var(--muted)}
  .bk-actions{display:flex;gap:8px;padding:0 14px;margin-bottom:26px;width:100%}
  .bk-actions button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 12px Georgia,serif;padding:10px 4px;border-radius:16px;background:#ffffff14;color:#eadfce}
  .bk-actions button.y{background:var(--yellow);color:#221a08}
  .bk-actions button:active{background:#fff2}
  .bk-actions svg{width:20px;height:20px}
  .fab{position:absolute;right:18px;bottom:96px;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;font-size:28px;box-shadow:0 6px 20px #0a84ff55;z-index:5}
  /* notes */
  .note{padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .note .q{font:18px/1.35 Georgia,serif;margin:6px 0}
  .note .meta{font-size:12px;color:var(--muted)}
  .nh{display:flex;gap:8px;align-items:center;font-size:13px}
  .nh .t{width:22px}
  /* stats */
  .streak{text-align:center;margin:10px 0 18px}
  .streak .n{font:300 64px/1 system-ui;letter-spacing:-2px}
  .streak .l{font-size:12px;color:var(--muted);margin-top:4px}
  .dots{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:10px 10px}
  .dots span{aspect-ratio:1;border-radius:50%;background:#3a2a0c;display:flex;align-items:center;justify-content:center;font-size:9px;color:#0006}
  .dots span.on{background:var(--amber)}.dots span.today{outline:2px solid #fff3}
  .dots span.fut{background:#1a1a1c}
  .mnav{display:flex;justify-content:space-between;align-items:center;margin:4px 6px 10px}
  .mnav b{font-size:20px;letter-spacing:.5px}.mnav button{font-size:22px;padding:2px 10px;color:var(--muted)}
  .dow,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .dow{font-size:9px;color:var(--muted);text-align:center;margin-bottom:6px}
  .cal div{aspect-ratio:2/3;border-radius:3px;overflow:hidden;position:relative;font-size:9px;color:#555}
  .cal img,.cal .ph{width:100%;height:100%;border-radius:3px;object-fit:cover;box-shadow:none;aspect-ratio:auto;font-size:6px;padding:2px}
  .cal .dn{position:absolute;top:1px;left:3px;font-size:8px}
  .chart{display:flex;align-items:flex-end;gap:2px;height:130px;margin:10px 0 4px;border-bottom:1px solid var(--line)}
  .chart i{flex:1;background:var(--pink);border-radius:2px 2px 0 0;min-height:1px}
  .xl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
  .tile{background:var(--card);border-radius:14px;padding:14px}.tile b{font-size:24px;display:block}.tile span{font-size:12px;color:var(--muted)}
  /* modal */
  #gate{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;justify-content:center;padding:28px;background:radial-gradient(circle at 50% 20%,#2a211c,#000 75%);overflow-y:auto}
  #gate.show{display:flex}
  #gate h2{font:700 28px Georgia,serif;margin:0 0 4px;text-align:center}
  #gate .err{color:#ff6b6b;font-size:13px;min-height:18px;margin:10px 0 4px;text-align:center}
  #gate .skip{margin-top:18px;text-align:center;font-size:13px;color:var(--muted);text-decoration:underline}
  #modal{position:absolute;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}
  #modal.show{display:flex}
  .sheet{background:var(--sheet);width:100%;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px}
  .sheet h2{margin:0 0 6px;font-size:18px}
  .res{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
  .res .c{width:44px;flex:none}.res .ph{font-size:8px}
  .res b{display:block;font-size:14px}
  .timer{font:300 60px ui-monospace,monospace;text-align:center;margin:20px 0}
  .row{display:flex;gap:10px}
  .toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);background:#fff;color:#000;padding:8px 16px;border-radius:99px;font-size:13px;z-index:30}
  a.btn{text-decoration:none;color:inherit}a.btn.y{color:var(--accentfg)}
  .btn svg{width:17px;height:17px;vertical-align:-3px}
  .rhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:14px}.rhead h1{margin:0}
  .fchip{justify-self:end;display:flex;align-items:center;gap:3px;font-weight:700;font-size:14px;padding:3px 10px 3px 6px;border-radius:999px;background:var(--card2)}
  .fchip svg{width:15px;height:19px}.fchip.out svg{filter:grayscale(1);opacity:.5}
  .flamebox{position:relative;width:118px;height:150px;margin:0 auto 6px}
  .flamebox .flame{width:100%;height:100%;filter:drop-shadow(0 0 18px #ff7a1a88);transform-origin:50% 100%;animation:burn 1.6s ease-in-out infinite alternate}
  .flamebox.out .flame{filter:grayscale(1) brightness(.6);animation:none;opacity:.55}
  .fnum{position:absolute;left:0;right:0;bottom:16px;text-align:center;font:800 38px/1 system-ui;color:#5a1a05}
  .flamebox.out .fnum{color:#fff}
  @keyframes burn{0%{transform:scale(1,1) skewX(0)}50%{transform:scale(.97,1.04) skewX(-1.5deg)}100%{transform:scale(1.02,.98) skewX(1.5deg)}}
  @media(prefers-reduced-motion:reduce){.flamebox .flame{animation:none}}
  .streak .l b{color:var(--fg)}
  .seg svg{width:15px;height:17px;vertical-align:-3px}
  .goal{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:16px;padding:14px;margin:14px 0}
  .goal svg{width:76px;height:76px;flex:none}.goal b{display:block;font-size:17px}.goal span{display:block;font-size:12px;color:var(--muted);margin:2px 0 8px}
  .wraph{text-align:center;margin:12px 0 4px}.wraph b{display:block;font:800 64px/1 Georgia,serif;background:linear-gradient(#ffe08a,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent}.wraph span{font:italic 16px Georgia,serif;color:var(--muted)}

<body>
<div id="app">
  <div id="view"></div>
  <nav id="nav"></nav>
  <input type="file" id="pick" accept="image/*" hidden>
  <input type="file" id="cam" accept="image/*" capture="environment" hidden>
  <input type="file" id="gal" accept="image/*" hidden>
  <div id="editui"></div>
  <div id="bookov"></div>
  <div id="modal"></div>
  <div id="gate"></div>
</div>
<script>
/* ---------- state ---------- */
const KEY='bookshelf-tracker-v1';
const SHARE_ID=new URLSearchParams(location.search).get('shelf'), VIEW=!!SHARE_ID;   // a shared shelf opens read-only
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{books:[],sessions:[],notes:[],currentId:null,timer:null};
const save=()=>{if(VIEW)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!auth)toast('Browser storage is full, so that change was not saved')}queuePush()};
let page=null, notePreset=null, tab='home', libFilter='all', libView='shelf', statView='streak', calM=new Date(), noteFilter='all';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const dkey=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>dkey(new Date());
const book=id=>S.books.find(b=>b.id===id);
const hash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const PAL=['#ff4a1c','#f2b705','#2d9cdb','#8fbf6a','#e0457b','#9b6bff','#f28c28','#4fc3b5','#d9d2c3'];
const pal=t=>PAL[hash(t)%PAL.length];
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;$('#app').appendChild(t);setTimeout(()=>t.remove(),1800)};

function coverHTML(b,cls='cover'){
  if(b.cover) return `<img class="${cls}" src="${esc(b.cover)}" alt="" loading="lazy" onerror="this.outerHTML=phHTML(this.dataset.id)" data-id="${b.id}">`;
  return phHTML(b.id);
}
function phHTML(id){const b=book(id)||{title:'?'};return `<div class="ph" style="background:${pal(b.title)}">${esc(b.title)}</div>`}

/* ---------- modal ---------- */
function openModal(html,mount){const m=$('#modal');m.innerHTML=`<div class="sheet">${html}</div>`;m.classList.add('show');mount&&mount(m)}
function closeModal(){const m=$('#modal');m.classList.remove('show');m.innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ---------- data helpers ---------- */
function pct(b){return b.pages?Math.min(100,Math.round(b.current/b.pages*100)):0}
function streak(){
  const days=new Set(S.sessions.map(s=>s.date));let n=0;const d=new Date();
  if(!days.has(dkey(d)))d.setDate(d.getDate()-1);
  while(days.has(dkey(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function setStatus(b,st){
  b.status=st;
  if(st==='finished'){b.finished=today();if(b.pages)b.current=b.pages}
  if(st==='reading'&&!S.currentId)S.currentId=b.id;
  if(S.currentId===b.id&&st!=='reading')S.currentId=(S.books.find(x=>x.status==='reading'&&x.id!==b.id)||{}).id||null;
}

function renderNav(){

/* ---------- reading ---------- */
let tickT;
function fmt(ms){const s=Math.floor(ms/1000);return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':')}
function timerModal(b){
  if(!S.timer){S.timer={bookId:b.id,start:Date.now()};save()}
  const t=S.timer;const tb=book(t.bookId);
  openModal(`<div class="center muted">${esc(tb.title)}</div><div class="timer" id="tt">${fmt(Date.now()-t.start)}</div>
    <div class="row"><button class="btn r" id="disc">Discard</button><button class="btn y" id="fin">Finish session</button></div>
    <button class="btn" id="bg" style="margin-top:10px">Keep running in background</button>`,()=>{
    clearInterval(tickT);tickT=setInterval(()=>{const e=$('#tt');if(e)e.textContent=fmt(Date.now()-t.start);else clearInterval(tickT)},500);
    $('#disc').onclick=()=>{S.timer=null;save();clearInterval(tickT);closeModal();render()};
    $('#bg').onclick=()=>{closeModal();render()};
    $('#fin').onclick=()=>{clearInterval(tickT);const mins=Math.max(1,Math.round((Date.now()-t.start)/60000));S.timer=null;save();logModal(tb,mins)};
  });
}
function logModal(b,mins){
  openModal(`<h2>Log session</h2><div class="muted" style="font-size:13px">${esc(b.title)}</div>
    <label>Current page${b.pages?` (of ${b.pages})`:''}</label><input id="pg" type="number" min="0" value="${b.current}">
    <label>Minutes read</label><input id="mn" type="number" min="0" value="${mins??''}" placeholder="optional">
    <div class="row" style="margin-top:16px"><button class="btn" id="c">Cancel</button><button class="btn y" id="s">Save</button></div>`,()=>{
    $('#c').onclick=()=>{closeModal();render()};
    $('#s').onclick=()=>{
      const np=Math.max(0,+$('#pg').value||0),m=+$('#mn').value||0,delta=Math.max(0,np-b.current);
      if(delta>0||m>0)S.sessions.push({id:uid(),bookId:b.id,date:today(),minutes:m,pages:delta});
      b.current=np;if(b.pages&&np>=b.pages)setStatus(b,'finished');
      const done=b.status==='finished';save();closeModal();toast(done?'Finished!':'Saved');render();if(done&&!b.rating)rateModal(b);
    };
  });
}

  });

/* ---------- add book ---------- */
/* ---------- discover: search, authors and genres (Open Library, plus Google Books when it answers) ---------- */
// [Open Library code, name, Google Books code]
const LANGS=[['','Any language',''],['eng','English','en'],['hin','Hindi','hi'],['tel','Telugu','te'],['tam','Tamil','ta'],['kan','Kannada','kn'],['mal','Malayalam','ml'],
  ['mar','Marathi','mr'],['ben','Bengali','bn'],['guj','Gujarati','gu'],['pan','Punjabi','pa'],['urd','Urdu','ur'],['spa','Spanish','es'],['fre','French','fr'],['ger','German','de'],
  ['ita','Italian','it'],['por','Portuguese','pt'],['rus','Russian','ru'],['jpn','Japanese','ja'],['chi','Chinese','zh'],['kor','Korean','ko'],['ara','Arabic','ar'],['tur','Turkish','tr'],['dut','Dutch','nl']];
const MORE_LANGS={pol:'Polish',swe:'Swedish',cze:'Czech',gre:'Greek',heb:'Hebrew',hun:'Hungarian',ukr:'Ukrainian',rum:'Romanian',dan:'Danish',nor:'Norwegian',fin:'Finnish',ind:'Indonesian',vie:'Vietnamese',tha:'Thai',per:'Persian',lat:'Latin',cat:'Catalan',bul:'Bulgarian',srp:'Serbian',hrv:'Croatian',slo:'Slovak',lit:'Lithuanian',est:'Estonian',lav:'Latvian',ice:'Icelandic',wel:'Welsh',gle:'Irish',epo:'Esperanto',nep:'Nepali',sin:'Sinhala',may:'Malay',tgl:'Tagalog',swa:'Swahili',ori:'Odia',asm:'Assamese',san:'Sanskrit'};
const langName=c=>{const l=LANGS.find(x=>c&&(x[0]===c||x[2]===c));return l?l[1]:MORE_LANGS[c]||String(c||'').toUpperCase()};
// the chosen language first, then the rest
const langsFirst=(a,lang)=>lang&&(a||[]).includes(lang)?[lang].concat(a.filter(x=>x!==lang)):a||[];
const langOptions=sel=>LANGS.map(([k,n])=>`<option value="${k}"${k===sel?' selected':''}>${n}</option>`).join('');
const OLF='key,title,author_name,author_key,cover_i,first_publish_year,number_of_pages_median,language,subject,publisher,ratings_average,edition_count';
const cleanSubjects=a=>[...new Set((a||[]).flatMap(s=>String(s).split(/,\s*/)).filter(s=>s&&s.length>2&&s.length<32&&!/[:=]|new york times|bestseller|accessible book|protected daisy|in library|lending library|large type|translations|^fiction$|^general$/i.test(s))
  .map(s=>s.trim().replace(/\b\w/g,c=>c.toUpperCase())))].filter((s,i,a)=>a.findIndex(x=>x.toLowerCase().replace(/[^a-z]/g,'')===s.toLowerCase().replace(/[^a-z]/g,''))===i).slice(0,8);
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9ऀ-෿぀-鿿]+/g,'');
const olDoc=d=>({title:d.title,author:(d.author_name||[]).slice(0,2).join(', '),authorKey:(d.author_key||[])[0]||'',pages:d.number_of_pages_median||0,
  cover:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`:'',isbn:'',year:d.first_publish_year||'',lang:d.language||[],
  subjects:cleanSubjects(d.subject),rating:d.ratings_average?Math.round(d.ratings_average*10)/10:0,work:d.key||'',publisher:(d.publisher||[])[0]||'',editions:d.edition_count||0});
function gItem(it){
  const v=it.volumeInfo||{};let c=v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail);
  const ids=(v.industryIdentifiers||[]).map(x=>x.identifier),isbn=ids.find(x=>x.length===13)||ids[0]||'';
  if(c)c=c.replace('http:','https:').replace('zoom=1','zoom=2').replace('&edge=curl','');
  else if(isbn)c=`https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`;
  return {title:v.title+(v.subtitle?': '+v.subtitle:''),author:(v.authors||[]).slice(0,2).join(', '),authorKey:'',pages:v.pageCount||0,cover:c||'',isbn,
    year:String(v.publishedDate||'').slice(0,4),lang:v.language?[v.language]:[],subjects:cleanSubjects(v.categories),rating:v.averageRating||0,work:'',
    publisher:v.publisher||'',desc:v.description||'',editions:0};
}
async function olSearch(params,lang,offset=0,limit=40){
  const u=new URLSearchParams(Object.assign({fields:OLF,limit,offset},params));if(lang)u.set('language',lang);
  const r=await fetch('https://openlibrary.org/search.json?'+u);if(!r.ok)throw new Error('search failed');
  const j=await r.json();return {total:j.numFound||0,items:(j.docs||[]).map(olDoc)};
}
async function gSearch(q,lang){
  try{const g=(LANGS.find(l=>l[0]===lang)||[])[2];
    const r=await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=20&printType=books&q='+encodeURIComponent(q)+(g?'&langRestrict='+g:''));
    if(!r.ok)return [];return ((await r.json()).items||[]).map(gItem)}
  catch(e){return []}
}
async function searchBooks(q,lang,offset=0){
  const isbn=q.replace(/[-\s]/g,''),isI=/^\d{9}[\dX]$|^\d{13}$/i.test(isbn);
  const [ol,g]=await Promise.all([olSearch(isI?{isbn}:{q},lang,offset).catch(()=>({total:0,items:[]})),offset?[]:gSearch(isI?'isbn:'+isbn:q,lang)]);
  const seen=new Set(ol.items.map(o=>norm(o.title)+'|'+norm(o.author.split(',')[0])));
  const extra=g.filter(o=>{const k=norm(o.title)+'|'+norm(o.author.split(',')[0]);if(seen.has(k))return false;seen.add(k);return true});
  if(isI&&ol.items[0]&&!ol.items[0].isbn)ol.items[0].isbn=isbn;
  return {total:ol.total+extra.length,items:ol.items.concat(extra)};
}
const inLib=o=>S.books.find(b=>norm(b.title)===norm(o.title)&&(!o.author||!b.author||norm(b.author.split(',')[0].trim().split(' ').pop())===norm(o.author.split(',')[0].trim().split(' ').pop())));
const metaLine=(o,lang)=>{const l=langsFirst(o.lang,lang);return [o.year,o.pages&&o.pages+' pages',l.length&&l.slice(0,2).map(langName).join(', ')+(l.length>2?` +${l.length-2} more`:''),o.rating&&'★ '+o.rating].filter(Boolean).map(esc).join(' · ')};
const resCover=o=>o.cover?`<img class="cover" loading="lazy" src="${esc(o.cover.replace('-L.jpg','-M.jpg'))}" alt="" onerror="this.outerHTML='<div class=ph style=background:#555></div>'">`:`<div class="ph" style="background:${pal(o.title)}">${esc(o.title)}</div>`;
function addFromResult(o,st){
  const b={id:uid(),title:o.title,author:o.author||'',cover:o.cover||'',pages:o.pages||0,current:0,status:'want',added:today(),isbn:o.isbn||'',
    year:o.year||'',publisher:o.publisher||'',lang:o.lang||[],subjects:o.subjects||[],ratingAvg:o.rating||0,authorKey:o.authorKey||'',work:o.work||''};
  if(o.desc)b.desc=o.desc.slice(0,900);
  S.books.push(b);setStatus(b,st);if(st==='reading')S.currentId=b.id;
  if(tab==='library'&&!curLib().all)curLib().books.push(b.id);
  save();closeModal();toast('Added to your library');
  if(page&&(page.type==='author'||page.type==='subject'))repaintPage();else render();
}
function bookSheet(o){
  const have=inLib(o);if(have)return openBookPage(have);
  openModal(`<div class="bsheet"><div class="c">${resCover(o)}</div><div style="min-width:0"><h2 class="serif" style="font-size:20px;line-height:1.2">${esc(o.title)}</h2>
      ${o.author?`<button class="alink big" id="bsa">${esc(o.author)}</button>`:''}<span class="rmeta" style="margin-top:6px">${metaLine(o,S.searchLang)}</span></div></div>
    ${o.subjects&&o.subjects.length?`<div class="tags" style="margin-top:12px">${o.subjects.map(s=>`<button class="tag" data-sj="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:''}
    <p class="binfo" id="bsd" style="margin:12px 0;max-height:150px;overflow:auto">${esc(o.desc||(o.work?'Loading description…':''))}</p>
    <div class="sec" style="margin-top:4px">Add to your library</div>
    <div class="stack" style="margin:0"><button class="btn y" data-s="reading">Currently reading</button><button class="btn" data-s="want">Want to read</button><button class="btn" data-s="finished">Already finished</button></div>`,()=>{
    $('#modal').querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>addFromResult(o,x.dataset.s));
    if($('#bsa'))$('#bsa').onclick=()=>openAuthor(o.author.split(',')[0].trim(),o.authorKey);
    $('#modal').querySelectorAll('[data-sj]').forEach(x=>x.onclick=()=>openSubject(x.dataset.sj));
    if(!o.desc&&o.work)fetch(`https://openlibrary.org${o.work}.json`).then(r=>r.json()).then(w=>{const d=w.description;
      o.desc=String(typeof d==='string'?d:(d&&d.value)||'').split(/\n-{3,}|\(\[source/)[0].trim().slice(0,900);
      const el=$('#bsd');if(el)el.textContent=o.desc||'No description available.'}).catch(()=>{const el=$('#bsd');if(el)el.textContent=''});
  });
}
function addBook(){
  let lang=S.searchLang||'',q='',offset=0,items=[],total=0;
  openModal(`<h2>Add a book</h2>
    <div class="row"><input id="q" placeholder="Title, author or ISBN" enterkeyhint="search"><button class="btn y sm" id="go">Search</button></div>
    <div class="srow2"><select id="ql" aria-label="Language">${langOptions(lang)}</select><span id="qn" class="muted"></span></div>
    <div id="res"></div><button class="btn" id="more" style="margin-top:10px;display:none">Show more books</button>
    <details style="margin-top:14px"><summary class="muted" style="cursor:pointer">Add manually</summary>
      <label>Title</label><input id="mt"><label>Author</label><input id="ma"><label>Pages</label><input id="mp" type="number">
      <button class="btn y" id="mad" style="margin-top:12px">Add</button></details>`,()=>{
    const paint=()=>{
      $('#qn').textContent=q?`${total.toLocaleString()} book${total===1?'':'s'} found`:'';
      $('#res').innerHTML=items.length?items.map((o,i)=>`<div class="res" data-i="${i}"><div class="c">${resCover(o)}</div><div style="flex:1;min-width:0"><b>${esc(o.title)}</b>
        ${o.author?`<button class="alink" data-au="${i}">${esc(o.author)}</button>`:''}<span class="rmeta">${metaLine(o,lang)}</span></div>${inLib(o)?'<span class="inlib">In library</span>':''}</div>`).join(''):
        q?'<div class="muted center" style="padding:20px">No results. Try another language, or add it manually.</div>':'';
      $('#more').style.display=items.length&&items.length<total?'block':'none';
      $('#res').querySelectorAll('.res').forEach(el=>el.onclick=()=>bookSheet(items[el.dataset.i]));
      $('#res').querySelectorAll('[data-au]').forEach(el=>el.onclick=e=>{e.stopPropagation();const o=items[el.dataset.au];openAuthor(o.author.split(',')[0].trim(),o.authorKey)});
    };
    const run=async(more)=>{
      if(!more){q=$('#q').value.trim();if(!q)return;offset=0;items=[];$('#res').innerHTML='<div class="muted center" style="padding:20px">Searching…</div>'}
      else{offset+=40;$('#more').textContent='Loading…'}
      const r=await searchBooks(q,lang,offset);if(!$('#res'))return;
      items=more?items.concat(r.items):r.items;total=more?total:r.total;$('#more').textContent='Show more books';paint();
    };
    $('#go').onclick=()=>run(false);$('#q').onkeydown=e=>{if(e.key==='Enter')run(false)};
    $('#ql').onchange=e=>{lang=S.searchLang=e.target.value;save();if(q)run(false)};
    $('#more').onclick=()=>run(true);
    $('#mad').onclick=()=>{const t=$('#mt').value.trim();if(!t)return;pickStatus({title:t,author:$('#ma').value.trim(),pages:+$('#mp').value||0,cover:''},addFromResult)};
    $('#q').focus();
  });
}

// author and genre pages
function openAuthor(name,key){closeModal();$('#bookov').classList.remove('show');$('#bookov').innerHTML='';page={type:'author',name,key:key||'',lang:S.searchLang||'',sort:'editions',prev:page};render()}
function openSubject(name){closeModal();page={type:'subject',name,lang:S.searchLang||'',sort:'editions',prev:page};render()}
async function loadDiscover(p,more){
  if(p.type==='author'){
    if(!p.key){try{p.key=((await (await fetch('https://openlibrary.org/search/authors.json?limit=1&q='+encodeURIComponent(p.name))).json()).docs[0]||{}).key||''}catch(e){}}
    if(p.key&&!p.info){try{const a=await (await fetch(`https://openlibrary.org/authors/${p.key}.json`)).json();
      p.info={bio:typeof a.bio==='string'?a.bio:(a.bio&&a.bio.value)||'',born:a.birth_date||'',died:a.death_date||'',photo:(a.photos||[]).some(x=>x>0)?`https://covers.openlibrary.org/a/olid/${p.key}-M.jpg`:''}}catch(e){p.info={}}}
  }
  const params=p.type==='author'?(p.key?{q:'author_key:'+p.key}:{author:p.name}):{q:`subject:"${p.name}"`};
  if(!more)p.offset=0;else p.offset+=60;
  try{const r=await olSearch(Object.assign(params,{sort:p.sort}),p.lang,p.offset,60);p.items=more?(p.items||[]).concat(r.items):r.items;p.total=r.total;p.err=''}
  catch(e){p.items=p.items||[];p.err='Could not load books. Check your internet connection.'}
}
function vDiscover(){
  const p=page,v=$('#view'),info=p.info||{};
  const head=p.type==='author'?`<div class="authhead">${info.photo?`<img src="${info.photo}" alt="">`:`<div class="avatar big">${esc(p.name[0]||'?')}</div>`}
      <div><b>${esc(p.name)}</b><span>${esc(info.born?info.born+(info.died?' – '+info.died:''):'')}</span><span>${p.total!=null?p.total.toLocaleString()+' books':''}</span></div></div>
      ${info.bio?`<p class="bio" id="bio">${esc(info.bio.split(/\(\[source|\n-{3,}/)[0].trim().slice(0,1200))}</p>`:''}`:
    `<div class="authhead"><div class="avatar big">#</div><div><i class="muted" style="font:italic 13px Georgia,serif">Genre</i><b>${esc(p.name)}</b><span>${p.total!=null?p.total.toLocaleString()+' books':''}</span></div></div>`;
  const items=p.items||[];
  v.innerHTML=`<div class="phead"><button class="back" id="pb" aria-label="Back">‹</button><h1 class="title">${p.type==='author'?'Author':'Genre'}</h1><span></span></div>${head}
    <div class="drow"><select id="dl" aria-label="Language">${langOptions(p.lang)}</select><select id="ds" aria-label="Sort">${[['editions','Most popular'],['new','Newest'],['old','Oldest'],['rating','Top rated'],['title','A–Z']].map(([k,l])=>`<option value="${k}"${p.sort===k?' selected':''}>${l}</option>`).join('')}</select></div>
    ${!p.items?'<div class="muted center" style="padding:30px">Loading books…</div>':p.err?`<div class="empty"><p>${esc(p.err)}</p></div>`:!items.length?`<div class="empty"><p>No books found${p.lang?' in '+langName(p.lang):''}.</p></div>`:
      `<div class="dgrid">${items.map((o,i)=>`<button class="dcell" data-i="${i}">${resCover(o)}${inLib(o)?'<span class="inlib">✓</span>':''}<b>${esc(o.title)}</b><span>${esc([o.year,o.rating&&'★ '+o.rating].filter(Boolean).join(' · '))}</span></button>`).join('')}</div>
       ${items.length<p.total?'<button class="btn" id="dmore" style="margin-top:16px">Show more books</button>':''}`}`;
  $('#pb').onclick=()=>{page=p.prev||null;render()};
  if($('#bio'))$('#bio').onclick=()=>$('#bio').classList.toggle('open');
  $('#dl').onchange=e=>{p.lang=S.searchLang=e.target.value;save();p.items=null;repaintPage();loadDiscover(p).then(()=>{if(page===p)repaintPage()})};
  $('#ds').onchange=e=>{p.sort=e.target.value;p.items=null;repaintPage();loadDiscover(p).then(()=>{if(page===p)repaintPage()})};
  v.querySelectorAll('.dcell').forEach(x=>x.onclick=()=>bookSheet(items[x.dataset.i]));
  if($('#dmore'))$('#dmore').onclick=()=>{$('#dmore').textContent='Loading…';loadDiscover(p,true).then(()=>{if(page===p)repaintPage()})};
  if(!p.items&&!p.loading){p.loading=true;loadDiscover(p).then(()=>{p.loading=false;if(page===p)repaintPage()})}
}
// fill in a library book's details (year, publisher, languages, genres, description) from Open Library
async function loadMeta(b){
  if(b.meta)return;b.meta=1;
  try{
    const u=new URLSearchParams({fields:OLF,limit:1,title:b.title});if(b.author)u.set('author',b.author.split(',')[0].trim());
    const d=((await (await fetch('https://openlibrary.org/search.json?'+u)).json()).docs||[])[0];
    if(d){const o=olDoc(d);

  const f=$('#pick');f.value='';f.multiple=!!cut;
  f.onchange=()=>[...f.files].forEach(file=>{const im=new Image();
    im.onload=()=>{const z=Math.min(1,maxDim/Math.max(im.width,im.height));let c=document.createElement('canvas');
      c.width=Math.round(im.width*z);c.height=Math.round(im.height*z);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(im.src);if(cut)c=cutBackground(c);cb(c.toDataURL(type,.82),c.width,c.height)};
    im.onerror=()=>toast('Could not read that picture');im.src=URL.createObjectURL(file)});
  f.click();
}

/* cover colour: average of the cover weighted towards its saturated pixels */
function coverColor(b){return new Promise(res=>{
  if(b.sp)return res();
  let done=false;const fin=(bg,fg)=>{if(done)return;done=true;
    if(!bg){const h=pal(b.title);bg=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));fg=null}
    bg=bg.map(Math.round);const lum=c=>.299*c[0]+.587*c[1]+.114*c[2];
    if(!fg||Math.abs(lum(fg)-lum(bg))<90)fg=lum(bg)>140?[28,22,18]:[248,242,232];
    const [r,g,l]=bg,mx=Math.max(r,g,l),dl=mx-Math.min(r,g,l);
    b.rgb=bg;b.sp={bg,fg:fg.map(Math.round)};
    b.hk=dl<=18?400+Math.round(mx):Math.round(((mx===r?((g-l)/dl)%6:mx===g?(l-r)/dl+2:(r-g)/dl+4)*60+360)%360);   // greys sort last
    res()};
  if(!b.cover)return fin();
  const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{try{
    const W=24,H=36,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(im,0,0,W,H);
    const d=x.getImageData(0,0,W,H).data,bins=new Map();
    for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const i=(y*W+xx)*4,k=(d[i]>>5)+'.'+(d[i+1]>>5)+'.'+(d[i+2]>>5),w=xx<4?3:1;   // the edge next to the spine counts more
      const e=bins.get(k)||{n:0,r:0,g:0,b:0};e.n+=w;e.r+=d[i]*w;e.g+=d[i+1]*w;e.b+=d[i+2]*w;bins.set(k,e)}
    const pal2=[...bins.values()].map(e=>({n:e.n,c:[e.r/e.n,e.g/e.n,e.b/e.n]})).sort((a,c)=>c.n-a.n);
    const total=pal2.reduce((a,e)=>a+e.n,0),bg=pal2[0].c,lum=c=>.299*c[0]+.587*c[1]+.114*c[2],sat=c=>Math.max(...c)-Math.min(...c);
    let fg=null,best=0;
    for(const e of pal2){if(e.n<total*.012)continue;const score=Math.abs(lum(e.c)-lum(bg))+sat(e.c)*.35;if(score>best&&Math.abs(lum(e.c)-lum(bg))>=90){best=score;fg=e.c}}
    fin(bg,fg)}catch(e){fin()}};
  im.onerror=()=>fin();im.src=b.cover+(b.cover.includes('?')?'&':'?')+'cors=1';setTimeout(fin,6000);
})}

const cssu=u=>esc(String(u).replace(/["'()\\\s]/g,c=>'%'+c.charCodeAt(0).toString(16)));
function spineBg(b,flat){

  if(!b.sp)return b.cover?`background:linear-gradient(#0005,#0005),#2a2a2e url(${cssu(b.cover)}) 0 50%/800% 100% no-repeat;`:`background:${pal(b.title)};`;
  const bg=`rgb(${b.sp.bg})`,fg=`rgb(${b.sp.fg})`,dir=flat?'to right,':'';
  return `background:linear-gradient(${dir}transparent 7%,${fg} 7% 7.8%,transparent 7.8% 92.2%,${fg} 92.2% 93%,transparent 93%),${bg};color:${fg};text-shadow:none;`;
}
// a photo of the book's real spine: a sideways photo is turned upright, then kept small
function pickSpinePhoto(b,done){
  const f=$('#pick');f.value='';f.multiple=false;
  f.onchange=()=>{const file=f.files[0];if(!file)return;const im=new Image();
    im.onload=()=>{const rot=im.width>im.height,sw=rot?im.height:im.width,sh=rot?im.width:im.height,z=Math.min(1,600/sh);
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*z));c.height=Math.max(1,Math.round(sh*z));const x=c.getContext('2d');
      if(rot){x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(im,0,0,c.height,c.width)}else x.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(im.src);b.spineImg=c.toDataURL('image/jpeg',.82);save();toast('Spine photo added');done&&done()};

  f.click();

const backBg=b=>b.rgb?`background:rgb(${b.rgb.map(v=>Math.round(v*.28+20)).join(',')});`:'background:#2b2b2d;';
const lastName=b=>(b.author||'').split(',')[0].trim().split(' ').pop();
const spineW=b=>Math.max(20,Math.min(40,Math.round((b.pages||280)/11)));
const bookH=b=>132;
// books grouped into shelf units; neighbouring flat books share one pile
const unitsOf=books=>{const u=[];for(const b of books){const f=b.face||'spine',last=u[u.length-1];
  if(f==='flat'){if(last&&last.pile&&last.books.length<4)last.books.push(b);else u.push({pile:true,books:[b],w:130})}
  else u.push({b,f,w:(f==='cover'?Math.round(bookH(b)*.66):spineW(b))+1})}return u};
const unitsW=u=>u.reduce((a,x)=>a+x.w,0);
function shelfHTML(list){
  const sh=S.shelf, W=shelfW(), byRow={};
  sh.objects.forEach(o=>(byRow[o.row]=byRow[o.row]||[]).push(o));
  // each book lives on its own ledge (b.row); books without one take the first ledge with room
  const cap=r=>W-(byRow[r]||[]).reduce((a,o)=>a+objSize(o.k)[0]+4,0), rb=[], at=r=>rb[r]||(rb[r]=[]);
  list.forEach(b=>{if(b.row!=null)at(b.row).push(b)});
  for(let r=0;r<rb.length&&r<200;r++){const row=at(r);                       // an overfull ledge spills onto the next
    while(row.length>1&&unitsW(unitsOf(row))>cap(r)){const b=row.pop();b.row=r+1;at(r+1).unshift(b)}}
  list.forEach(b=>{if(b.row!=null)return;let r=0;
    while(at(r).length&&unitsW(unitsOf(at(r).concat(b)))>cap(r))r++;
    b.row=r;at(r).push(b)});
  const n=Math.max(sh.rows,rb.length,...sh.objects.map(o=>o.row+1),1), rows=[];
  for(let r=0;r<n;r++)rows.push(unitsOf(at(r)));
  save();
  rowCount=rows.length;if(selRow>=rowCount)selRow=0;
  const tf=b=>{const t=(b.flip?'rotate(180deg) ':'')+(b.mirror?'scaleX(-1)':'');return t?`transform:${t};`:''};
  const sel=b=>edit&&selBook===b.id?' sel':'';
  const unit=u=>{
    if(u.pile)return `<div class="stackcol">${u.books.map(b=>`<div class="flat${sel(b)}" data-id="${b.id}" style="width:${96+hash(b.title)%22}px;height:${Math.max(16,spineW(b)-6)}px;${tf(b)}${spineBg(b,true)}">${esc(b.title.slice(0,18))}</div>`).join('')}</div>`;
    const b=u.b,h=bookH(b);
    if(u.f==='cover')return `<div class="cov${sel(b)}" data-id="${b.id}" style="width:${Math.round(h*.66)}px;height:${h}px;${tf(b)}">${coverHTML(b)}</div>`;
    if(u.f==='edge')return `<div class="edge${sel(b)}" data-id="${b.id}" title="${esc(b.title)}" style="width:${spineW(b)}px;height:${h}px;${tf(b)}"></div>`;
    return `<div class="spine${sel(b)}" data-id="${b.id}" title="${esc(b.title)}" style="width:${spineW(b)}px;height:${h}px;${tf(b)}${spineBg(b)}"><span class="st">${esc(b.title.slice(0,20))}</span><span class="sa">${esc(lastName(b).slice(0,9))}</span></div>`;
  };
  const lc=LIGHTC[sh.lightColor]||LIGHTC.warm, fl=FLAMES[sh.flame]||FLAMES.warm, dim=sh.dim?`linear-gradient(rgba(0,0,0,${sh.dim}),rgba(0,0,0,${sh.dim})),`:'';
  return `<div class="case" style="background:${dim}${wallCss(sh.wall)};border:${FRAMES[sh.frame]||'0'};--f1:${fl[0]};--f2:${fl[1]};--f3:${fl[2]}">${sh.drape?`<div class="drape" style="background-image:${drapeSvg(sh.drapeColor)}"></div>`:''}${rows.map((r,i)=>
    `<div class="shelf${edit&&selRow===i?' selrow':''}" data-row="${i}" style="height:${sh.rowH}px">${r.map(unit).join('')}<div class="sp-gap"></div>${(byRow[i]||[]).map(o=>{const [w,h]=objSize(o.k);return `<div class="deco" data-obj="${o.id}" style="width:${w}px;height:${h}px">${objImg(o.k)}${flames(o.k)}</div>`}).join('')}</div><div class="ledge" style="background:${LEDGES[sh.ledge].css}"></div>${sh.lights?lightsHTML(sh,lc):''}`).join('')}</div>`;
}

/* ---------- drag to move (decorate mode): mouse drags at once, touch after a short hold ---------- */
function dragDown(e){
  const el=e.target.closest('[data-id],[data-obj]');if(!el||drag)return;
  const d=drag={el,x:e.clientX,y:e.clientY,on:false};
  if(e.pointerType!=='mouse')d.t=setTimeout(()=>dragBegin(d),230);
}
function dragBegin(d){
  if(drag!==d)return;
  const r=d.el.getBoundingClientRect(),g=d.el.cloneNode(true);
  g.classList.add('ghost');g.classList.remove('sel');
  Object.assign(g.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',margin:0});
  document.body.appendChild(g);
  Object.assign(d,{on:true,g,ox:d.x-r.left,oy:d.y-r.top});
  d.el.style.opacity=.25;
  if(navigator.vibrate)navigator.vibrate(15);
}
document.addEventListener('pointermove',e=>{
  const d=drag;if(!d)return;
  if(!d.on){
    if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<7)return;
    if(e.pointerType==='mouse')dragBegin(d);else{clearTimeout(d.t);drag=null;return}   // a moving finger is a scroll
  }
  d.g.style.left=(e.clientX-d.ox)+'px';d.g.style.top=(e.clientY-d.oy)+'px';
});
function dragEnd(e,cancel){
  const d=drag;if(!d)return;
  clearTimeout(d.t);drag=null;
  if(!d.on)return;
  d.g.remove();dragJust=true;setTimeout(()=>dragJust=false,60);
  if(cancel){vLibrary();return}
  dropOn(d.el,document.elementFromPoint(e.clientX,e.clientY),e.clientX,e.clientY);
}
document.addEventListener('pointerup',e=>dragEnd(e,false));
document.addEventListener('pointercancel',e=>dragEnd(e,true));
document.addEventListener('touchmove',e=>{if(drag&&drag.on)e.preventDefault()},{passive:false});
function dropOn(el,t,x,y){
  const shelfEl=t&&t.closest('.shelf');
  if(el.dataset.obj){
    const o=S.shelf.objects.find(o=>o.id===el.dataset.obj);
    if(o&&shelfEl){const row=+shelfEl.dataset.row;
      if(row!==o.row&&!objFits(row,o.k))toast('No room on that ledge');else{o.row=row;selRow=row}}
  }else{
    const b=book(el.dataset.id);let tb=t&&t.closest('[data-id]');
    if(shelfEl&&!(tb&&tb.dataset.id===b.id)){
      if(!tb){                                          // dropped on bare ledge: go beside the nearest book there
        const cx=n=>{const r=n.getBoundingClientRect();return r.left+r.width/2};
        tb=[...shelfEl.querySelectorAll('[data-id]')].filter(n=>n.dataset.id!==b.id).sort((p,q)=>Math.abs(cx(p)-x)-Math.abs(cx(q)-x))[0];
      }
      b.row=+shelfEl.dataset.row;
      S.books.splice(S.books.indexOf(b),1);
      if(tb){
        const r=tb.getBoundingClientRect(),o=book(tb.dataset.id);
        const after=tb.classList.contains('flat')?y<r.top+r.height/2:x>r.left+r.width/2;   // a pile grows upwards
        S.books.splice(S.books.indexOf(o)+(after?1:0),0,b);
      }else S.books.push(b);                            // an empty ledge
    }
    selBook=b.id;tool='move';
  }
  save();vLibrary();
}

async function act(a,v){
  const sh=S.shelf,b=book(selBook);
  if(a==='tool'){tool=v;if(v!=='move')selBook=null}
  else if(a==='face'&&b)b.face=v;
  else if(a==='flip'&&b)b.flip=!b.flip;
  else if(a==='mirror'&&b)b.mirror=!b.mirror;
  else if(a==='spinephoto'&&b){pickSpinePhoto(b,()=>vLibrary());return}
  else if(a==='nospine'&&b)delete b.spineImg;
  else if(a==='mv'&&b){const dir=+v,row=libList().filter(x=>x.row===b.row),o=row[row.indexOf(b)+dir];
    if(o){const i=S.books.indexOf(b),j=S.books.indexOf(o);[S.books[i],S.books[j]]=[S.books[j],S.books[i]]}
    else if(b.row+dir>=0){                              // past the end of a ledge: step onto the neighbouring one
      b.row+=dir;S.books.splice(S.books.indexOf(b),1);
      let k=dir>0?S.books.findIndex(x=>x.row===b.row):S.books.reduce((m,x,i)=>x.row===b.row?i+1:m,0);
      if(k<0)k=S.books.length;S.books.splice(k,0,b)}}
  else if(a==='sort'){
    if(v==='color'){await Promise.all(S.books.map(coverColor));S.books.sort((x,y)=>x.hk-y.hk)}
    else if(v==='pages')S.books.sort((x,y)=>(y.pages||0)-(x.pages||0));
    else if(v==='author')S.books.sort((x,y)=>(lastName(x)||'~').localeCompare(lastName(y)||'~'));
    else if(v==='title')S.books.sort((x,y)=>x.title.localeCompare(y.title));
    else for(let i=S.books.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.books[i],S.books[j]]=[S.books[j],S.books[i]]}
    S.books.forEach(x=>delete x.row);                    // arranging refills the ledges from the top
  }
  else if(a==='cat')objCat=v;
  else if(a==='obj'){if(!objFits(selRow,v))toast('No room on that ledge');else sh.objects.push({id:uid(),k:v,row:selRow})}
  else if(a==='pickwall'){pickImage(1000,'image/jpeg',src=>{sh.customWall=src;sh.wall='custom';save();vLibrary()});return}
  else if(a==='pickobj'){pickImage(320,'image/png',(src,w,h)=>{S.custom.push({id:uid(),src,w,h});save();vLibrary()},true);return}
  else if(a==='delc'){S.custom=S.custom.filter(c=>c.id!==v);sh.objects=sh.objects.filter(o=>o.k!=='c:'+v)}
  else if(a==='ttab')themeTab=v;
  else if(a==='theme')applyTheme(v);
  else if(a==='wall')sh.wall=v;
  else if(a==='ledge')sh.ledge=v;
  else if(a==='rows'){sh.rows=Math.max(1,Math.min(12,sh.rows+ +v));sh.objects=sh.objects.filter(o=>o.row<Math.max(sh.rows,rowCount+ +v))}
  else if(a==='tcat')themeCat=v;
  else if(a==='set'){const [k,val]=v.split('=');sh[k]=isNaN(val)?val:+val;if(k==='lightColor'||k==='lightStyle')sh.lights=true;if(k==='drapeColor')sh.drape=true;
    if(/^(lightColor|lightStyle|flame)$/.test(k)){save();vLibrary();revealLights(k==='flame');return}}
  else if(a==='lights'){sh.lights=!sh.lights;save();vLibrary();if(sh.lights)revealLights(false);return}
  else if(a==='drape')sh.drape=!sh.drape;
  save();vLibrary();
}

// the edit panel covers the lower shelf, so scroll the first lights (or flames) into the space above it
function revealLights(flame){
  const panel=$('#editui .epanel'),view=$('#view');
  const target=flame?document.querySelector('.deco .fl'):document.querySelector('.lights');
  if(!target){if(flame)toast('Add a candle or lamp from Objects → Light to see the flames');return}
  if(!panel)return;
  const vt=view.getBoundingClientRect().top,free=panel.getBoundingClientRect().top-vt;
  const t=target.getBoundingClientRect().top-vt+view.scrollTop;
  view.scrollTo({top:Math.max(0,t-free*.6),behavior:'smooth'});
}

async function loadDesc(b){
  if(b.desc!=null||!b.isbn)return;
  try{
    const ed=await (await fetch(`https://openlibrary.org/isbn/${encodeURIComponent(b.isbn)}.json`)).json();
    let d=ed.description;
    if(!d&&ed.works&&ed.works[0])d=(await (await fetch(`https://openlibrary.org${ed.works[0].key}.json`)).json()).description;
    b.desc=String(typeof d==='string'?d:(d&&d.value)||'').split(/\n-{3,}|\(\[source/)[0].trim().slice(0,700);
    save();
    const el=$('#bdesc');if(el&&el.dataset.id===b.id)el.textContent=b.desc;
  }catch(e){}
}

function sChart(range){
  const now=new Date();let buckets=[],filter;
  if(range==='month'){for(let i=29;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);buckets.push({k:dkey(d),l:d.getDate()})};filter=s=>s.date}
  else{const n=range==='year'?12:Math.max(6,Math.min(36,S.sessions.length?(now.getFullYear()-new Date(S.sessions.map(s=>s.date).sort()[0]).getFullYear())*12+now.getMonth()-new Date(S.sessions.map(s=>s.date).sort()[0]).getMonth()+1:6));
    for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);buckets.push({k:dkey(d).slice(0,7),l:d.toLocaleString('en',{month:'short'})})};filter=s=>s.date.slice(0,7)}
  const range0=buckets[0].k;
  const inR=S.sessions.filter(s=>filter(s)>=range0);
  buckets.forEach(b=>b.p=inR.filter(s=>filter(s)===b.k).reduce((a,s)=>a+s.pages,0));
  const max=Math.max(1,...buckets.map(b=>b.p));

/* ---------- scan a quote from a photo (Tesseract.js, loaded on first use) ---------- */
let tessP=null;
function loadTess(){
  return tessP||(tessP=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload=()=>res(window.Tesseract);
    s.onerror=()=>{tessP=null;s.remove();rej(new Error('Could not load the text reader. Check your internet connection.'))};
    document.head.appendChild(s);
  }));
}
function pickPhoto(camera){return new Promise(res=>{const f=$(camera?'#cam':'#gal');f.value='';f.onchange=()=>res(f.files[0]||null);f.click()})}
async function ocrFile(file,onp){
  const T=await loadTess();
  const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>j(new Error('Could not read that picture'));i.src=URL.createObjectURL(file)});
  const z=Math.min(1,2000/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*z);c.height=Math.round(im.height*z);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);
  onp(-1);
  const w=await Promise.race([T.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')onp(Math.round(m.progress*100))}}),
    new Promise((_,j)=>setTimeout(()=>j(new Error('The text reader did not start. Check your internet connection and try again.')),90000))]);
  try{return (await Promise.race([w.recognize(c),new Promise((_,j)=>setTimeout(()=>j(new Error('Reading took too long. Try a closer photo of just the lines you want.')),120000))])).data.text}
  finally{w.terminate()}
}
const tidyOCR=t=>String(t||'').replace(/-\s*\n\s*/g,'').replace(/\s*\n\s*/g,' ').replace(/\s{2,}/g,' ').trim();
async function scanInto(ta,st,camera){
  const file=await pickPhoto(camera);if(!file)return;
  const btns=[...document.querySelectorAll('#scan,#scang')];btns.forEach(b=>b.disabled=true);
  st.textContent='Photo received. Loading the text reader… (the first time downloads about 4 MB)';
  try{
    const text=tidyOCR(await ocrFile(file,p=>{st.textContent=p<0?'Starting the text reader…':`Reading the page… ${p}%`}));
    if(!text){st.textContent='No text found. Try a sharper, well-lit photo of the page.';return}
    ta.value=ta.value.trim()?ta.value.trim()+' '+text:text;
    st.textContent='Done. Trim the quote down to the part you want to keep.';ta.focus();
  }catch(e){st.textContent=(e&&e.message)||'Could not read that photo. Try again with a sharper photo.'}
  finally{btns.forEach(b=>b.disabled=false)}
}

// --- the PNG is drawn on a canvas from an off-screen copy of the shelf ---
function loadImg(src){return new Promise(res=>{
  if(!src)return res(null);
  const im=new Image();
  try{if(!src.startsWith('data:')&&new URL(src,location.href).origin!==location.origin)im.crossOrigin='anonymous'}catch(e){}
  im.onload=()=>res(im);im.onerror=()=>res(null);setTimeout(()=>res(null),9000);im.src=src;
})}
function parseBg(css){
  css=String(css||'');
  const url=(css.match(/url\(\s*["']?([^"')]+)["']?\s*\)/)||[])[1]||null;
  const size=+((css.match(/\/\s*(\d+)px/)||[])[1]||0);
  const lin=[...css.matchAll(/linear-gradient\(((?:[^()]|\([^()]*\))*)\)/g)].map(m=>m[1].split(/,(?![^(]*\))/).map(s=>s.trim().split(/\s+(?![^(]*\))/)[0]));
  return {url,cover:/center\s*\/\s*cover/.test(css),size,lin,plain:!url&&!lin.length?css.trim():null};
}
async function paintBg(ctx,css,x,y,w,h,s){
  const p=parseBg(css);
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  if(p.plain){ctx.fillStyle=p.plain;ctx.fillRect(x,y,w,h)}
  const im=p.url&&await loadImg(p.url);
  if(im){
    if(p.cover){const z=Math.max(w/im.width,h/im.height);ctx.drawImage(im,x+(w-im.width*z)/2,y+(h-im.height*z)/2,im.width*z,im.height*z)}
    else{
      const t=p.size||im.width,c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(t*s));c.height=Math.max(1,Math.round(t*s*im.height/im.width));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      const pat=ctx.createPattern(c,'repeat');pat.setTransform(new DOMMatrix([1/s,0,0,1/s,0,0]));
      ctx.translate(x,y);ctx.fillStyle=pat;ctx.fillRect(0,0,w,h);ctx.translate(-x,-y);
    }
  }
  for(const g of p.lin.slice().reverse()){
    const cols=g.filter(v=>!/deg$|^to$/.test(v));if(cols.length<2)continue;
    const gr=ctx.createLinearGradient(0,y,0,y+h);cols.forEach((c,i)=>gr.addColorStop(i/(cols.length-1),c));ctx.fillStyle=gr;ctx.fillRect(x,y,w,h);
  }
  if(/radial-gradient\(#fff/.test(css)){ctx.fillStyle='#fff';for(let i=0;i<w*h/900;i++){ctx.globalAlpha=.4+Math.random()*.6;ctx.fillRect(x+Math.random()*w,y+Math.random()*h,1.3,1.3)}ctx.globalAlpha=1}
  ctx.restore();
}
function vGrad(ctx,y,h,stops){const g=ctx.createLinearGradient(0,y,0,y+h);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}
async function paintBookFace(ctx,b,r,flat){
  const gloss=()=>{const g=flat?vGrad(ctx,r.y,r.h,[[0,'rgba(255,255,255,.13)'],[.4,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.5)']]):ctx.createLinearGradient(r.x,0,r.x+r.w,0);
    if(!flat)[[0,'rgba(0,0,0,.5)'],[.28,'rgba(0,0,0,0)'],[.5,'rgba(255,255,255,.13)'],[.72,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.56)']].forEach(([o,c])=>g.addColorStop(o,c));
    ctx.fillStyle=g;ctx.fillRect(r.x,r.y,r.w,r.h)};
  if(b.spineImg&&!flat){const im=await loadImg(b.spineImg);if(im){ctx.drawImage(im,r.x,r.y,r.w,r.h);gloss();return}}
  let ink;
  if(b.sp){
    ctx.fillStyle=`rgb(${b.sp.bg})`;ctx.fillRect(r.x,r.y,r.w,r.h);ink=`rgb(${b.sp.fg})`;ctx.fillStyle=ink;
    if(flat){ctx.fillRect(r.x+r.w*.07,r.y,Math.max(1,r.w*.008),r.h);ctx.fillRect(r.x+r.w*.922,r.y,Math.max(1,r.w*.008),r.h)}
    else{ctx.fillRect(r.x,r.y+r.h*.07,r.w,Math.max(1,r.h*.008));ctx.fillRect(r.x,r.y+r.h*.922,r.w,Math.max(1,r.h*.008))}
  }else{
    const im=b.cover&&await loadImg(b.cover);
    if(im){ctx.drawImage(im,0,0,im.width/8,im.height,r.x,r.y,r.w,r.h);ctx.fillStyle='rgba(0,0,0,.33)';ctx.fillRect(r.x,r.y,r.w,r.h)}
    else{ctx.fillStyle=b.cover?'#2a2a2e':pal(b.title);ctx.fillRect(r.x,r.y,r.w,r.h)}
  }
  gloss();
  ctx.fillStyle=ink||'#fff';ctx.shadowColor=ink?'transparent':'rgba(0,0,0,.9)';ctx.shadowBlur=ink?0:3;
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(flat){ctx.font='bold 9px Georgia,serif';ctx.fillText(b.title.slice(0,18),r.x+r.w/2,r.y+r.h/2,r.w-10)}
  else{
    ctx.save();ctx.translate(r.x+r.w/2,r.y+r.h/2-5);ctx.rotate(Math.PI/2);ctx.font='italic bold 10px Georgia,serif';ctx.fillText(b.title.slice(0,20),0,0,r.h-30);ctx.restore();
    ctx.font='bold 6.5px Georgia,serif';ctx.textBaseline='alphabetic';ctx.fillText(lastName(b).slice(0,9),r.x+r.w/2,r.y+r.h-6,r.w-2);
  }
  ctx.shadowColor='transparent';ctx.shadowBlur=0;
}
async function shelfCanvas(){
  const s=2, wrap=document.createElement('div');
  wrap.style.cssText=`position:absolute;left:-10000px;top:0;width:${$('#app').clientWidth-36}px`;
  const prev=edit;edit=false;wrap.innerHTML=shelfHTML(libList());edit=prev;$('#app').appendChild(wrap);
  try{
    const cs=wrap.querySelector('.case'),sh=S.shelf;cs.style.position='relative';
    const UNITS='.spine,.cov,.flat,.edge';
    cs.querySelectorAll(UNITS).forEach(e=>e.style.setProperty('transform','none','important'));
    const R=cs.getBoundingClientRect(),rel=e=>{const q=e.getBoundingClientRect();return {x:q.left-R.left,y:q.top-R.top,w:q.width,h:q.height}};
    const pad=16,head=70,foot=34,W=R.width+pad*2,H=R.height+head+foot;
    const cv=document.createElement('canvas');cv.width=Math.round(W*s);cv.height=Math.round(H*s);
    const ctx=cv.getContext('2d');ctx.scale(s,s);
    ctx.fillStyle='#0b0b0c';ctx.fillRect(0,0,W,H);
    const name=curLib().all?(auth?auth.username.split('@')[0]+"'s bookshelf":'My bookshelf'):curLib().name;
    ctx.fillStyle='#f2f2f2';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.font='bold 24px Georgia,serif';ctx.fillText(name,W/2,38,W-30);
    ctx.fillStyle='#8a8a90';ctx.font='12px system-ui,sans-serif';ctx.fillText(`${libList().length} book${libList().length===1?'':'s'}`,W/2,58);
    ctx.save();ctx.translate(pad,head);
    ctx.beginPath();ctx.roundRect?ctx.roundRect(0,0,R.width,R.height,10):ctx.rect(0,0,R.width,R.height);ctx.clip();
    const dim=sh.dim?`linear-gradient(rgba(0,0,0,${sh.dim}),rgba(0,0,0,${sh.dim})),`:'';
    await paintBg(ctx,dim+wallCss(sh.wall),0,0,R.width,R.height,s);
    const dr=cs.querySelector('.drape');if(dr){const r=rel(dr);await paintBg(ctx,dr.getAttribute('style'),r.x,r.y,r.w,r.h,s)}
    for(const el of cs.querySelectorAll('.shelf')){const r=rel(el);ctx.fillStyle=vGrad(ctx,r.y+r.h-22,22,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.7)']]);ctx.fillRect(r.x,r.y+r.h-22,r.w,22)}
    for(const el of cs.querySelectorAll(UNITS)){
      const b=book(el.dataset.id);if(!b)continue;const r=rel(el);ctx.save();
      if(el.classList.contains('lean')){ctx.translate(r.x,r.y+r.h);ctx.rotate(-7*Math.PI/180);ctx.translate(-r.x,-(r.y+r.h))}
      if(b.flip||b.mirror){ctx.translate(r.x+r.w/2,r.y+r.h/2);if(b.flip)ctx.rotate(Math.PI);if(b.mirror)ctx.scale(-1,1);ctx.translate(-(r.x+r.w/2),-(r.y+r.h/2))}
      ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=6;ctx.shadowOffsetX=2;
      if(el.classList.contains('cov')){
        const im=b.cover&&await loadImg(b.cover);
        if(im){const z=Math.max(r.w/im.width,r.h/im.height),sw=r.w/z,sh2=r.h/z;ctx.drawImage(im,(im.width-sw)/2,(im.height-sh2)/2,sw,sh2,r.x,r.y,r.w,r.h)}
        else{ctx.fillStyle=pal(b.title);ctx.fillRect(r.x,r.y,r.w,r.h);ctx.shadowColor='transparent';ctx.fillStyle='#111';ctx.font='bold 11px Georgia,serif';ctx.textAlign='center';ctx.fillText(b.title.slice(0,16),r.x+r.w/2,r.y+r.h/2,r.w-8)}
      }else if(el.classList.contains('edge')){
        ctx.fillStyle='#f5f1e7';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.shadowColor='transparent';
        ctx.fillStyle='#cfc8b8';for(let x=r.x+2;x<r.x+r.w;x+=3)ctx.fillRect(x,r.y,1,r.h);
        ctx.fillStyle='#777';ctx.fillRect(r.x,r.y,r.w,3);ctx.fillRect(r.x,r.y+r.h-3,r.w,3);
      }else{ctx.fillStyle='#000';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.shadowColor='transparent';ctx.shadowBlur=0;await paintBookFace(ctx,b,r,el.classList.contains('flat'))}
      ctx.restore();
    }
    const fl=FLAMES[sh.flame]||FLAMES.warm;
    for(const el of cs.querySelectorAll('.deco')){
      const o=sh.objects.find(x=>x.id===el.dataset.obj);if(!o)continue;const r=rel(el),im=await loadImg(objSrc(o.k));
      if(im){ctx.save();ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=6;ctx.shadowOffsetY=5;ctx.drawImage(im,r.x,r.y,r.w,r.h);ctx.restore()}
      for(const [fx,fy,z,glowOnly] of LIGHTS[o.k]||[]){
        const cx=r.x+fx*r.w,cy=r.y+fy*r.h;
        ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.5;
        const g=ctx.createRadialGradient(cx,cy-z*.9,0,cx,cy-z*.9,z*5.5);g.addColorStop(0,fl[2]);g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g;ctx.fillRect(cx-z*5.5,cy-z*6.4,z*11,z*11);ctx.restore();
        if(!glowOnly){const f=ctx.createRadialGradient(cx,cy-z*.56,0,cx,cy-z*.56,z*1.1);f.addColorStop(0,'#fff');f.addColorStop(.25,fl[0]);f.addColorStop(.6,fl[1]);f.addColorStop(1,'rgba(0,0,0,0)');
          ctx.fillStyle=f;ctx.beginPath();ctx.ellipse(cx,cy-z,z/2,z,0,0,Math.PI*2);ctx.fill()}
      }
    }
    for(const el of cs.querySelectorAll('.ledge')){const r=rel(el);await paintBg(ctx,LEDGES[sh.ledge].css,r.x,r.y,r.w,r.h,s);
      ctx.fillStyle=vGrad(ctx,r.y,r.h,[[0,'rgba(255,255,255,.4)'],[.22,'rgba(255,255,255,0)'],[.5,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.63)']]);ctx.fillRect(r.x,r.y,r.w,r.h)}
    const [lc,lg]=LIGHTC[sh.lightColor]||LIGHTC.warm;
    for(const el of cs.querySelectorAll('.lights')){
      const r=rel(el),st=sh.lightStyle||'dots';
      if(st==='dots'){for(let i=9;i<r.w;i+=18){const cx=r.x+i,cy=r.y+10,g=ctx.createRadialGradient(cx,cy,0,cx,cy,7);g.addColorStop(0,'#fff');g.addColorStop(.15,lc);g.addColorStop(.37,lc);g.addColorStop(.46,lg);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(cx-7,cy-7,14,14)}}
      else if(st==='strip'){ctx.fillStyle=vGrad(ctx,r.y,r.h,[[0,lc],[.06,lg],[1,'rgba(0,0,0,0)']]);ctx.fillRect(r.x,r.y,r.w,r.h)}
      else await paintBg(ctx,el.getAttribute('style'),r.x,r.y,r.w,r.h,s);
    }
    const fm=String(FRAMES[sh.frame]||'').match(/(\d+)px solid (#\w+)/);
    if(fm){ctx.strokeStyle=fm[2];ctx.lineWidth=+fm[1];ctx.strokeRect(+fm[1]/2,+fm[1]/2,R.width-+fm[1],R.height-+fm[1])}
    ctx.restore();
    ctx.fillStyle='#55555c';ctx.font='11px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('Made with Book Shelf',W/2,H-12);
    return cv;
  }finally{wrap.remove()}
}

/* ---------- log reading for a day ---------- */
function dayLogModal(k){
  if(!S.books.length){toast('Add a book first');return addBook()}
  const label=k===today()?'today':new Date(k+'T12:00:00').toLocaleDateString('en',{weekday:'long',day:'numeric',month:'short'});
  const done=S.sessions.filter(x=>x.date===k);
  const opts=S.books.slice().sort((a,c)=>(c.id===S.currentId)-(a.id===S.currentId)||(c.status==='reading')-(a.status==='reading'));
  openModal(`<h2>Reading ${esc(label)}</h2>
    ${done.length?`<div class="muted" style="font-size:13px;margin-bottom:4px">Already logged:<br>${done.map(x=>`${esc((book(x.bookId)||{}).title||'A book')} · ${x.minutes||0} min${x.pages?' · '+x.pages+' pages':''}`).join('<br>')}</div>`:''}
    <label>Book</label><select id="lb">${opts.map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join('')}</select>
    <label>Minutes read</label><input id="lm" type="number" min="0" inputmode="numeric" value="20">
    <label>Pages read (optional)</label><input id="lp" type="number" min="0" inputmode="numeric" placeholder="0">
    <div class="row" style="margin-top:16px"><button class="btn" id="c">Cancel</button><button class="btn y" id="s">Save</button></div>`,()=>{
    $('#c').onclick=closeModal;
    $('#s').onclick=()=>{
      const b=book($('#lb').value),m=Math.max(0,Math.round(+$('#lm').value||0)),pg=Math.max(0,Math.round(+$('#lp').value||0));
      if(!m&&!pg){toast('Enter the minutes or pages you read');return}
      S.sessions.push({id:uid(),bookId:b.id,date:k,minutes:m,pages:pg});
      if(pg&&b.pages&&b.status!=='finished')b.current=Math.min(b.pages,(b.current||0)+pg);
      save();closeModal();render();toast(k===today()?'Logged. Today counts for your streak!':'Logged for '+label);
    };
  });
}

/* ---------- home ---------- */
function vHome(){
  const reading=S.books.filter(b=>b.status==='reading');
  let b=book(S.currentId);if(!b||b.status!=='reading')b=reading[0];
  if(b)S.currentId=b.id;
  const h=new Date().getHours(),greet=h<5?'Good night':h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const days=new Set(S.sessions.map(s=>s.date)),lit=days.has(today()),n=streak();
  const mins=S.sessions.filter(s=>s.date===today()).reduce((a,s)=>a+(s.minutes||0),0),p=Math.min(1,mins/20);
  const now=new Date(),sun=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay());

/* ---------- books ---------- */
let booksFilter='all', booksView='carousel', booksSort='recent', booksQ='';
const BSORT={recent:'Recent',title:'Title',author:'Author',rating:'Rating'};
function booksList(){
  const q=booksQ.trim().toLowerCase();
  let l=S.books.filter(b=>(booksFilter==='all'||b.status===booksFilter)&&(!q||(b.title+' '+(b.author||'')).toLowerCase().includes(q)));
  if(booksSort==='recent')l=l.map((b,i)=>[b,i]).sort((x,y)=>String(y[0].added||'').localeCompare(String(x[0].added||''))||y[1]-x[1]).map(x=>x[0]);
  else if(booksSort==='title')l.sort((x,y)=>x.title.localeCompare(y.title));
  else if(booksSort==='author')l.sort((x,y)=>(lastName(x)||'~').localeCompare(lastName(y)||'~'));
  else l.sort((x,y)=>(y.rating||0)-(x.rating||0));
  return l;
}
function paintBooks(){
  const l=booksList(),el=$('#blist');
  $('#bcount').textContent=`${l.length} book${l.length===1?'':'s'}`;
  el.innerHTML=!l.length?`<div class="empty"><p>${S.books.length?'No books match.':'No books yet. Tap + to add your first.'}</p></div>`:
    booksView==='grid'?`<div class="grid">${l.map(b=>`<div data-bk="${b.id}" style="cursor:pointer">${coverHTML(b)}<div class="gt">${esc(b.title)}</div>${rstars(b.rating)}</div>`).join('')}</div>`:
    booksView==='list'?l.map(b=>`<div class="blrow" data-bk="${b.id}"><div class="c">${coverHTML(b)}</div><div><b>${esc(b.title)}</b><span>${esc(b.author||'')}${b.status==='reading'&&b.pages?' · '+pct(b)+'%':''}</span>${rstars(b.rating)}</div></div>`).join(''):
    `<div class="carousel">${l.map(b=>`<div class="car" data-bk="${b.id}">${coverHTML(b)}<b>${esc(b.title)}</b><span>${esc(b.author||'')}</span></div>`).join('')}</div>`;
  el.querySelectorAll('[data-bk]').forEach(x=>x.onclick=()=>openBookPage(book(x.dataset.bk)));
}
function vBooks(){
  const cnt=s=>S.books.filter(b=>s==='all'||b.status===s).length;
  const F=[['reading','Currently Reading'],['want','To Be Read'],['finished','Finished'],['all','All']];
  const v=$('#view');
  v.innerHTML=`<div class="bighead"><h1>Your books</h1><button class="rbtn" id="badd" aria-label="Add a book">+</button></div>
    <div class="fchips">${F.map(([k,l])=>`<button class="fchip2${booksFilter===k?' on':''}" data-bf="${k}">${l} · ${cnt(k)}</button>`).join('')}</div>
    <input class="search" id="bq" placeholder="Search your books" value="${esc(booksQ)}">
    <div class="vrow"><span id="bcount"></span>${[['grid',GRID_I],['list',LIST_I],['carousel',CARO_I]].map(([k,i])=>`<button class="vbtn${booksView===k?' on':''}" data-bv="${k}" aria-label="${k} view">${ic(i)}</button>`).join('')}<button class="vbtn t" id="bsort">${BSORT[booksSort]}</button></div>
    <div id="blist"></div>`;
  $('#badd').onclick=addBook;
  v.querySelectorAll('[data-bf]').forEach(x=>x.onclick=()=>{booksFilter=x.dataset.bf;vBooks()});
  v.querySelectorAll('[data-bv]').forEach(x=>x.onclick=()=>{booksView=x.dataset.bv;vBooks()});

function bookStreak(b){
  const days=new Set(S.sessions.filter(s=>s.bookId===b.id).map(s=>s.date));let n=0;const d=new Date();
  if(!days.has(dkey(d)))d.setDate(d.getDate()-1);

  return n;
}
